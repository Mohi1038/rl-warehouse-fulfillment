[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockrush"
version = "1.0.0"
description = "Deadline-aware warehouse order fulfilment with attention-based PPO"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["warehouse_env*", "agents*"]

[tool.setuptools.package-data]
warehouse_env = ["layouts/*.txt"]

[tool.black]
line-length = 130
target-version = ["py311"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*pkg_resources.*"]
